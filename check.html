<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Card file checker</title>
<link rel="stylesheet" href="style.css">
<style>
textarea{width:100%;min-height:260px;box-sizing:border-box;font:13px/1.4 ui-monospace,Menlo,monospace;background:#0f1424;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
button{font:inherit;font-weight:700;padding:12px 16px;border-radius:12px;border:0;margin:8px 8px 8px 0;cursor:pointer}
.primary{background:var(--amber);color:#1b1200}.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.ok{color:#5ED38B;font-weight:700}.bad{color:#FF5F7B;font-weight:700}
li{margin:4px 0}
</style>
</head>
<body><main>
<h1>Card file checker</h1>
<p>Checks <code>cards.json</code> with the same rules the app uses. Paste the file below and tap <strong>Check this text</strong>, or check the copy that's live on the site now.</p>
<textarea id="text" spellcheck="false" placeholder='{ "format": 1, "cards": [ … ] }'></textarea>
<button class="primary" id="checkText">Check this text</button>
<button class="ghost" id="checkLive">Check the published file</button>
<div id="out"></div>
<footer>For Lights Bingo staff. Nothing here is saved or sent anywhere.</footer>
</main>
<script src="check.js"></script>
<script>
(function () {
  var SITE = 'https://thomas-innovative-technologies.github.io/lightsbingo/';
  var out = document.getElementById('out');
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function day(t) { return new Date(t).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }
  function show(text, label) {
    var L = window.LightsBingoCards;
    var r = L.parseCardFile(text, SITE);
    var now = Date.now();
    var html = '<h2>' + esc(label) + '</h2>';
    if (!r.ok) { out.innerHTML = html + '<p class="bad">✗ Not usable: ' + esc(r.error) + '</p><p>The app keeps using its last good copy until this is fixed.</p>'; return; }
    html += '<p class="ok">✓ The file is usable.</p>';
    var showing = L.listOrder(L.activeCards(r.cards, now)).map(function (c) { return c.id; });
    html += '<h3>Cards (' + r.cards.length + ')</h3><ul>';
    r.cards.forEach(function (c) {
      var state = c.startsAt > now ? 'starts ' + day(c.startsAt) : c.endsAt < now ? 'ended ' + day(c.endsAt) : 'showing now, until ' + day(c.endsAt);
      var flags = [c.sponsored ? 'Sponsored by ' + c.sponsor : '', c.featured ? 'featured (top of the list)' : '', c.hidden ? 'hidden (link only)' : '', c.items.length + ' items'].filter(Boolean).join(' · ');
      var link = SITE + 'card.html?id=' + c.id;
      html += '<li><strong>' + esc(c.title) + '</strong> (' + esc(c.id) + '): ' + esc(state) + '<br>' + esc(flags) + '<br>Link: <a href="' + esc(link) + '">' + esc(link) + '</a>' + (c.logo ? '<br>Logo: <img src="' + esc(c.logo) + '" alt="" style="width:32px;height:32px;vertical-align:middle;object-fit:contain" onerror="this.replaceWith(document.createTextNode(\'✗ not found on the site\'))">' : '') + '</li>';
    });
    html += '</ul>';
    if (r.pulled.length) html += '<p>Pulled (removed everywhere): ' + esc(r.pulled.join(', ')) + '</p>';
    html += r.problems.length ? '<h3>Fix these (the rest still works)</h3><ul>' + r.problems.map(function (p) { return '<li class="bad">' + esc(p) + '</li>'; }).join('') + '</ul>' : '<p class="ok">No problems found.</p>';
    html += '<p>In the list right now, in order: ' + (showing.length ? esc(showing.join(', ')) : 'none') + '.</p>';
    out.innerHTML = html;
  }
  document.getElementById('checkText').onclick = function () { show(document.getElementById('text').value, 'Pasted text'); };
  document.getElementById('checkLive').onclick = function () {
    fetch('cards.json', { cache: 'no-store' }).then(function (res) { return res.ok ? res.text() : Promise.reject(res.status); })
      .then(function (t) { document.getElementById('text').value = t; show(t, 'Published file'); })
      .catch(function (e) { out.innerHTML = '<p class="bad">Couldn’t load cards.json from the site (' + esc(e) + ').</p>'; });
  };
})();
</script>
</body>
</html>
